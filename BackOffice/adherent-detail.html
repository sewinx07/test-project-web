<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Back office - member profile, contact details and activity registrations.">
    <title>Sports Club - Back Office - Member Detail</title>
    <link rel="icon" type="image/png" href="../assets/img/icon.png">
    <meta name="theme-color" content="#1A56DB">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="backoffice-layout">

        <aside class="sidebar">
            <span class="sidebar-brand">Sports Club - Back Office</span>

            <nav aria-label="Back office">
                <ul class="sidebar-nav">
                    <li><a href="activites-liste.html">Activities</a></li>
                    <li><a href="activite-form.html">New Activity</a></li>
                    <li><a href="adherents-liste.html" aria-current="page">Members</a></li>
                    <li><a href="adherent-form.html">New Member</a></li>
                </ul>
            </nav>

            <div class="mt-6">
                <a class="btn btn-secondary btn-block" href="../FrontOffice/index.html">View Website</a>
            </div>
        </aside>

        <main class="main-content" id="main">

            <p class="form-feedback" id="detail-feedback" role="status" aria-live="polite" hidden></p>

            <div class="page-header">
                <h1 id="detail-title">Loading...</h1>
                <div class="actions">
                    <a class="btn btn-primary" id="edit-link" href="adherent-form.html">Edit</a>
                    <button class="btn btn-danger" id="delete-btn" type="button">Delete</button>
                    <a class="btn btn-secondary" href="adherents-liste.html">Back to List</a>
                </div>
            </div>

            <div class="about-card">
                <span class="eyebrow" id="detail-eyebrow">Member</span>
                <p class="about-text" id="detail-summary">Loading member profile...</p>
                <span id="detail-badges"></span>
            </div>

            <div class="table-wrapper">
                <table class="table-liste">
                    <thead>
                        <tr>
                            <th scope="col">Information</th>
                            <th scope="col">Details</th>
                        </tr>
                    </thead>
                    <tbody id="detail-fields">
                        <tr class="table-empty" data-loading><td colspan="2">Loading member details...</td></tr>
                    </tbody>
                </table>
            </div>

            <h2 class="section-title">Activity</h2>

            <div class="table-wrapper">
                <table class="table-inscrits">
                    <thead>
                        <tr>
                            <th scope="col">Activity</th>
                            <th scope="col">Day</th>
                            <th scope="col" class="num">Fee</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="actions-cell">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="detail-activity">
                        <tr class="table-empty" data-loading><td colspan="5">Loading activity...</td></tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/adherent-detail.js"></script>

</body>
</html>
