<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Back office - list and manage club members and their registration status.">
    <title>Sports Club - Back Office - Members</title>
    <link rel="icon" type="image/png" href="../assets/img/icon.png">
    <meta name="theme-color" content="#1A56DB">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="backoffice-layout">

        <aside class="sidebar">
            <span class="sidebar-brand">Sports Club - Back Office</span>

            <nav aria-label="Back office">
                <ul class="sidebar-nav">
                    <li><a href="activites-liste.html">Activities</a></li>
                    <li><a href="activite-form.html">New Activity</a></li>
                    <li><a href="adherents-liste.html" aria-current="page">Members</a></li>
                    <li><a href="adherent-form.html">New Member</a></li>
                </ul>
            </nav>

            <div class="mt-6">
                <a class="btn btn-secondary btn-block" href="../FrontOffice/index.html">View Website</a>
            </div>
        </aside>

        <main class="main-content" id="main">

            <div class="page-header">
                <h1>Members</h1>
                <div class="actions">
                    <a class="btn btn-primary" href="adherent-form.html">New Member</a>
                </div>
            </div>

            <div class="toolbar">
                <div class="field">
                    <label for="search">Search</label>
                    <input type="search" id="search" placeholder="Name, email or activity">
                </div>

                <div class="field">
                    <label for="filter-statut">Status</label>
                    <select id="filter-statut">
                        <option value="">All statuses</option>
                        <option value="actif">Active</option>
                        <option value="en_attente">Pending</option>
                        <option value="suspendu">Suspended</option>
                    </select>
                </div>

                <p class="toolbar-count" id="result-count" role="status" aria-live="polite"></p>
            </div>

            <p class="form-feedback" id="list-feedback" role="status" aria-live="polite" hidden></p>

            <div class="table-wrapper">
                <table class="table-liste">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone</th>
                            <th scope="col">Activity</th>
                            <th scope="col">Fee</th>
                            <th scope="col" class="actions-cell">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="table-empty" data-loading><td colspan="6">Loading members...</td></tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/adherents-liste.js"></script>

</body>
</html>
