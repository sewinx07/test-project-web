    <main id="main">
        <section class="section">
            <div class="container">

                <div class="page-header">
                    <h1>Member Registration</h1>
                </div>

                <form class="form-card form-narrow" action="#" method="POST">

                    <div class="form-row">
                        <div class="field">
                            <label for="prenom">First Name</label>
                            <input
                                type="text"
                                id="prenom"
                                name="prenom"
                                required
                                minlength="2"
                                maxlength="50"

                                title="The first name must contain between 2 and 50 letters.">
                        </div>

                        <div class="field">
                            <label for="nom">Last Name</label>
                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                required
                                minlength="2"
                                maxlength="50"
                                pattern="[A-Za-zÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬-ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¿ ]+"
                                title="The last name must contain between 2 and 50 letters.">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                required
                                maxlength="120"
                                placeholder="name@example.com"
                                title="Please enter a valid email address.">
                        </div>

                        <div class="field">
                            <label for="telephone">Phone</label>
                            <input
                                type="tel"
                                id="telephone"
                                name="telephone"
                                required
                                pattern="[0-9+ ]{8,15}"
                                placeholder="+216 70 000 000"
                                title="The phone number must contain between 8 and 15 digits.">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="date_naissance">Date of Birth</label>
                            <input
                                type="date"
                                id="date_naissance"
                                name="date_naissance"
                                required
                                max="2008-12-31"
                                title="Members must be at least 16 years old.">
                        </div>

                        <div class="field">
                            <label for="activite">Activity</label>
                            <select id="activite" name="activite" required>
                                <option value="">-- Choose an activity --</option>
                                <option value="football">Football</option>
                                <option value="natation">Swimming</option>
                                <option value="fitness">Fitness</option>
                                <option value="tennis">Tennis</option>
                                <option value="yoga">Yoga</option>
                                <option value="basket">Basketball</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="adresse">Address</label>
                        <input
                            type="text"
                            id="adresse"
                            name="adresse"
                            required
                            minlength="5"
                            maxlength="120"
                            title="The address must contain between 5 and 120 characters.">
                    </div>

                    <div class="field">
                        <label for="conditions">
                            <input type="checkbox" id="conditions" name="conditions" required>
                            I accept the club rules and conditions.
                        </label>
                    </div>

                    <div class="form-actions">
                        <input type="reset" value="Reset">
                        <input type="submit" value="Submit Registration">
                    </div>

                </form>

            </div>
        </section>
